name: Validate leaderboard results
on:
  pull_request:
    paths:
      - "docs/leaderboard/results.json"
      - "tools/validate_results.py"
  push:
    branches: [main]
    paths:
      - "docs/leaderboard/results.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/validate_results.py docs/leaderboard/results.json
